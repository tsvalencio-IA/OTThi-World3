name: Gerar APK OTTHI World V704

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL do GitHub Pages (deixe vazio para detectar automaticamente)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validar release e definir endereço do jogo
        shell: bash
        env:
          INPUT_APP_URL: ${{ inputs.app_url }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repo_name="${REPOSITORY#*/}"
          if [ -n "${INPUT_APP_URL}" ]; then
            app_url="${INPUT_APP_URL}"
          elif [ "${repo_name,,}" = "${OWNER,,}.github.io" ]; then
            app_url="https://${OWNER}.github.io/"
          else
            app_url="https://${OWNER}.github.io/${repo_name}/"
          fi
          case "$app_url" in
            http://*|https://*) ;;
            *) echo "URL inválida: $app_url"; exit 1 ;;
          esac
          [[ "$app_url" == */ ]] || app_url="$app_url/"
          echo "APP_URL=$app_url" >> "$GITHUB_ENV"
          export APP_URL="$app_url"

          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          version = json.loads(Path('VERSION.json').read_text(encoding='utf-8'))
          manifest_url = urllib.parse.urljoin(os.environ['APP_URL'], 'release-manifest.json')
          request = urllib.request.Request(
              manifest_url + '?apk_check=' + str(version['androidVersionCode']),
              headers={'Cache-Control': 'no-cache, no-store'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              remote = json.load(response)
          if remote.get('version') != version['version'] or remote.get('build') != version['build']:
              raise SystemExit(
                  f"GitHub Pages ainda não publicou {version['build']}. "
                  f"Recebido: {remote.get('version')} / {remote.get('build')}"
              )

          gradle = Path('android-app/app/build.gradle').read_text(encoding='utf-8')
          if f"versionCode {version['androidVersionCode']}" not in gradle:
              raise SystemExit('versionCode do Android diverge de VERSION.json')
          if f'versionName "{version["androidVersionName"]}"' not in gradle:
              raise SystemExit('versionName do Android diverge de VERSION.json')

          strings = Path('android-app/app/src/main/res/values/strings.xml')
          text = strings.read_text(encoding='utf-8').replace('__APP_URL__', os.environ['APP_URL'])
          strings.write_text(text, encoding='utf-8')

          env_path = Path(os.environ['GITHUB_ENV'])
          with env_path.open('a', encoding='utf-8') as out:
              out.write(f"APK_VERSION_CODE={version['androidVersionCode']}\n")
              out.write(f"APK_VERSION_NAME={version['androidVersionName']}\n")
              out.write(f"APK_DISPLAY_VERSION={version.get('apkDisplayVersion', version['androidVersionName'])}\n")
              out.write(f"APK_BUILD={version['build']}\n")
          print('Release remota validada:', remote['build'], remote.get('revision', 'sem-revisão'))
          print('APK apontará para:', os.environ['APP_URL'])
          PY

      - name: Validar segredos da assinatura permanente
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.OTTHI_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.OTTHI_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OTTHI_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OTTHI_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "Falta OTTHI_ANDROID_KEYSTORE_B64"; exit 1; }
          [ -n "$STORE_PASSWORD" ] || { echo "Falta OTTHI_ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "Falta OTTHI_ANDROID_KEY_ALIAS"; exit 1; }
          [ -n "$KEY_PASSWORD" ] || { echo "Falta OTTHI_ANDROID_KEY_PASSWORD"; exit 1; }

          mkdir -p "$RUNNER_TEMP/otthi-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/otthi-signing/otthi-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/otthi-signing/otthi-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          echo "OTTHI_STORE_FILE=$RUNNER_TEMP/otthi-signing/otthi-release.jks" >> "$GITHUB_ENV"
          echo "OTTHI_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "OTTHI_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "OTTHI_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Copiar ícone oficial
        run: cp icons/icon-512.png android-app/app/src/main/res/drawable/icon_otthos.png

      - name: Compilar APK release assinado
        run: gradle -p android-app --no-daemon assembleRelease

      - name: Verificar assinatura e preparar APK
        shell: bash
        run: |
          set -euo pipefail
          APK_SRC="android-app/app/build/outputs/apk/release/app-release.apk"
          [ -f "$APK_SRC" ] || { echo "APK release não encontrado"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_SRC"
          mkdir -p apk-pronto
          cp "$APK_SRC" apk-pronto/OTTHI-WORLD.apk
          cp "$APK_SRC" "apk-pronto/OTTHI-WORLD-V704-R14-${APK_VERSION_CODE}.apk"
          sha256sum apk-pronto/OTTHI-WORLD.apk | tee apk-pronto/OTTHI-WORLD-SHA256.txt

      - name: Publicar release para atualizações do aplicativo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-${APK_VERSION_CODE}"
          TITLE="OTTHI World ${APK_DISPLAY_VERSION}"
          NOTES="Build ${APK_BUILD} | Android ${APK_VERSION_NAME} (${APK_VERSION_CODE})."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apk-pronto/OTTHI-WORLD.apk apk-pronto/OTTHI-WORLD-SHA256.txt --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" apk-pronto/OTTHI-WORLD.apk apk-pronto/OTTHI-WORLD-SHA256.txt \
              --title "$TITLE" --notes "$NOTES" --latest --target "${GITHUB_SHA}"
          fi

      - name: Disponibilizar APK no Actions
        uses: actions/upload-artifact@v4
        with:
          name: OTTHI-WORLD-V704-R14-APK
          path: |
            apk-pronto/OTTHI-WORLD.apk
            apk-pronto/OTTHI-WORLD-V704-R14-${{ env.APK_VERSION_CODE }}.apk
            apk-pronto/OTTHI-WORLD-SHA256.txt
          if-no-files-found: error
          retention-days: 30
